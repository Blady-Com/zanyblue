Append_Usage=Usage: append parameter value
Append_Summary={0:>3}) "append", append values to a list parameter
Append_Docstring=append: append values to a list parameter\n\
\n\
\    Usage: append parameter value\n\
\n\
The append command adds a value to the end of a list parameter within\n\
current scope.  If the parameter does not exist, it is created as a list\n\
value with a single element.  If the parameter exists but is not a list,\n\
the value is first converted to a string and then converted to a list with\n\
a single value.  The argument value is then append to this list.\n\
\n\
Example::\n\
\n\
\    ZBTest> print l1\n\
\    The parameter "l1" is not defined\n\
\    ZBTest> append l1 a\n\
\    ZBTest> print l1\n\
\    [a]\n\
\    ZBTest> print -l l1\n\
\    1) "a"\n\
\    ZBTest> append l1 b\n\
\    ZBTest> print l1\n\
\    [a, b]\n\
\    ZBTest> print -l l1\n\
\    1) "a"\n\
\    2) "b"

Begin_Usage=Usage: begin
Begin_Summary={0:>3}) "begin", begin a new parameter scope
Begin_Docstring=begin: begin a new parameter scope\n\
\n\
\    Usage: begin\n\
\n\
The ``begin`` command starts a new ZBTest scope for parameters definitions.\n\
This is similar to standard scoping in programming languages, local\n\
definitions "hide" definitions in enclosing scopes, e.g.,::\n\
\n\
\   set x 10\n\
\   begin\n\
\   set x 11\n\
\   # References to the parameter "x" yield 11 here\n\
\   end\n\
\   # References to the parameter "x" yield 10 here\n\
\n\
Scopes allow tests to inherit definitions from enclosing scopes and\n\
localize parameter definitions and changes to the current test, restoring\n\
values on scope exit via the :ref:`zb-zbtest-commands-end` command.\n\
\n\
It is not normally necessary to explicitly begin a scope using the\n\
``begin`` command, scopes are implicitly created on starting the execution\n\
of a ZBTest script via the :ref:`zb-zbtest-commands-run` command.

Compare_Usage=Usage: compare log-file [ ref-log-file ]
Compare_Summary={0:>3}) "compare", compare a log file with a reference log
Compare_Docstring=compare: compare a log file with a reference log\n\
\n\
\    Usage: compare log-file [ ref-log-file ]\n\
\n\
The compare command compares (with regular expression matching) a\n\
generated log file with a reference log file.  If the files match, a\n\
.ok file is created and the number of OK tests is incremented, otherwise\n\
a .fail file is created and the number of FAIL tests is incremented.\n\
\n\
The reference log file is found by searching the searchpath parameter\n\
and is normally in the same directory as the .zbt test script.

Copy_Usage=Usage: copy file [ target ]
Copy_Summary={0:>3}) "copy", copy a file to the test area
Copy_Docstring=copy: copy a file to the test area\n\
\n\
\    Usage: copy file [ target ]\n\
\n\
Copy a file to the test area to use as input to commands under test.\n\
The file copied is located by searching the directories listed on the\n\
''searchpath'' parameter.\n\
\n\
The file copied retains the name of the source file.  To use another name\n\
the optional second argument can be used.\n\
\n\
To copy a directory tree, the "-r" option should be used.\n\
\n\
Examples\n\
\n\
* copy xmpl.in\n\
\  Copy the file named "xmpl.in" to the test area retaining the name.\n\
\n\
* copy xmpl.in example.dat\n\
\  Copy the file "xmpl.in" to the name "example.dat" in the test area.\n\
\n\
* copy -r mydir\n\
\  Copy the directory "mydir" to the test area.\n\
\n\
Files or directories copied to the test area are automatically removed\n\
when the current scope exited (either at the end of the test script or\n\
via an explicit "end").

Delenv_Usage=Usage: delenv name
Delenv_Summary={0:>3}) "delenv", delete an environment variable
Delenv_Docstring=delenv: delete an environment variable\n\
\n\
\    Usage: delenv name\n\
\n\
Delete an environment variable.  The value of the variable, if any,\n\
is restored on exiting the current scope.\n\
\n\
Examples::\n\
\n\
\  ZBTest> begin\n\
\  ZBTest> delenv HOME\n\
\  Deleting environment variable "HOME"\n\
\  ZBTest> end\n\
\  Executing the 'undo' action "setenv HOME "/home/mrohan""\n\
\  Setting the environment variable "HOME" to "/home/mrohan"\n\
\n\
Any commands executed after the "delenv" until the end of the scope will\n\
not see a value for the environment variable.

Delete_Usage=Usage: delete [ -r ] name
Delete_Summary={0:>3}) "delete", delete a file in the test area
Delete_Docstring=delete: delete a file in the test area\n\
\n\
\    Usage: delete [ -r ] name\n\
\n\
Delete a file from the test area.  With the "-r" option, a directory\n\
tree is deleted.

Desc_Usage=Usage: desc word ...
Desc_Summary={0:>3}) "desc", desc", set the test description
Desc_Docstring=desc: desc", set the test description\n\
\n\
\    Usage: desc word ...\n\
\n\
Set the test description

Dump_Usage=Usage: dump [ -o output-file ] [ -a ]
Dump_Summary={0:>3}) "dump", dump the contents of the parameter scope(s)
Dump_Docstring=dump: dump the contents of the parameter scope(s)\n\
\n\
\    Usage: dump [ -o output-file ] [ -a ]\n\
\n\
Dump parameters values.  The default is to dump the parameters\n\
for the current scope.  This is primarily a debugging command.\n\
\n\
The options are\n\
\n\
* "-a", Dump the parameters for all scopes\n\
\n\
* "-o", Dump the output to a file in the test area

Echo_Usage=Usage: echo name ...
Echo_Summary={0:>3}) "echo", echo arguments to output
Echo_Docstring=echo: echo arguments to output\n\
\n\
\    Usage: echo name ...\n\
\n\
Echo arguments to output.  References to parameters are expanded\n\
to string values before printing.\n\
\n\
Examples::\n\
\n\
\    ZBTest> echo a\n\
\    a\n\
\    ZBTest> set -i a 10\n\
\    ZBTest> echo a is $a\n\
\    a is 10

End_Usage=Usage: end
End_Summary={0:>3}) "end", end a parameter scope returning to previous scope
End_Docstring=end: end a parameter scope returning to previous scope\n\
\n\
\    Usage: end\n\
\n\
Exit a parameter scope.  Any assignments to made duing the scope\n\
are lost.  Previous definitions are restored, e.g.,::\n\
\n\
\    ZBTest> set xyz abc\n\
\    ZBTest> begin\n\
\    ZBTest> set xyz 123\n\
\    ZBTest> echo $xyz\n\
\    ZBTest> end\n\
\    ZBTest> echo $xyz\n\
\n\
The first "echo" prints the value "123" which the second prints the value\n\
"abc".\n\
\n\
It not normally necessary to use the "begin" and "end" commands as running\n\
a test script automatically start a new scope which is ended when the\n\
script completes.\n\
\n\
The "end" command also executes any "end actions" defined by commands\n\
executed during the scope.  E.g., the "copy" command add an "end action"\n\
to remove the file or directory copied into the test area.

Execute_Usage=Usage: execute [ -f | -s | -o output ] command [ command-arg ... ]
Execute_Summary={0:>3}) "execute", execute a system command
Execute_Docstring=execute: execute a system command\n\
\n\
\    Usage: execute [ -f | -s | -o output ] command [ command-arg ... ]\n\
\n\
Execute a command given the command name and an optional list\n\
of command arguments.  The command to execute is located by\n\
\n\
#. Searching from the current test directory up the directory tree\n\
\   for an executable with the command name in a bin directory, i.e.,\n\
\   if executing a command built in the current source tree.\n\
\n\
#. Or, searching the value of the "path" list parameter (initialized to\n\
\   the value of the "PATH" environment variable).\n\
\n\
The search attempts to find the first file with an extension defined by\n\
the "exes" list parameter that matches the command name.  For example,\n\
on Windows, the directories listed on the "path" parameter are searched\n\
for files with extensions "bat", "cmd", "com" or "exe".\n\
\n\
Once an executable is found, a new process is spawned to execute it.\n\
If the "-o" option is given, then the command output (standard output\n\
and standard error) is sent to the named file.\n\
\n\
The "-s" option defines a command that is expected to execute successfully.\n\
This is the default and the "-s" option is normally not given.\n\
\n\
The "-f" option defines a command that is expected fail (non-zero exit\n\
status).\n\
\n\
An execute failure file is generated if a command does not exit with the\n\
expected status.\n\
\n\
Examples\n\
\n\
#. Execute the "ls" command, the output is sent to the "screen"::\n\
\n\
\    ZBTest> execute ls\n\
\n\
#. Execute the "ls" command, the output is sent to the the file "ls.out"\n\
\   in the test area::\n\
\n\
\    ZBTest> execute -o ls.out ls\n\
\n\
#. Execute the "ls" command, the output is sent to the the file "ls.out"\n\
\   in the test area.  The command is expected to exit with a failure\n\
\   status in this case, i.e., the file "nosuchfile" is not expected to\n\
\   exist::\n\
\n\
\    ZBTest> execute -f -o ls.out ls nosuchfile\n\
\n\
The "execute" command is normally used with the "-o" option generating\n\
a log file for comparision with a reference log file via the ZBTest\n\
function "nextlog".

Exit_Usage=Usage: exit
Exit_Summary={0:>3}) "exit", the current test script
Exit_Docstring=exit: the current test script\n\
\n\
\    Usage: exit\n\
\n\
Exit a test script.  This command is normally only used when entering\n\
commands interactively to exit the zbtest application.  Using it in a test\n\
script causes immediate exit of the zbtest application.

Filestat_Usage=Usage: filestat name log-file
Filestat_Summary={0:>3}) "filestat", write status of a test area file to a log file
Filestat_Docstring=filestat: write status of a test area file to a log file\n\
\n\
\    Usage: filestat name log-file\n\
\n\
Write status of a test area file to a log file.  This is frequently\n\
used to verify the existence/non-existence of a file or directory in the\n\
test area.  The information written to the file stat log file, for ordinary\n\
files is:\n\
\n\
* The file name\n\
* The file type ("ORDINARY_FILE")\n\
* The file size in bytes\n\
* The time stamp associated with the file\n\
\n\
For directories and other non-ordinary files only the file name and type is\n\
writeen to the log file.\n\
\n\
If the target file for the filestat command does not exist in the test area\n\
the generated log file contains message::\n\
\n\
\    The file "NAME" does not exist\n\
\n\
Examples::\n\
\n\
\    ZBTest> filestat a\n\
\    ZBTest> filestat expected.txt expected01.log\n\
\    Generated status report on the file "expected.txt" (non-existent)\n\
\        to "expected01.log"\n\
\    ...\n\
\    ZBTest> filestat expected.txt expected02.log\n\
\    Generated status report on the file "expected.txt" to "expected02.log"

Getenv_Usage=Usage: getenv [ -l | -s | -p | -a ] name [ parameter ]
Getenv_Summary={0:>3}) "getenv", define a parameter based on an environment variable
Getenv_Docstring=getenv: define a parameter based on an environment variable\n\
\n\
\    Usage: getenv [ -l | -s | -p | -a ] name [ parameter ]\n\
\n\
Define an internal parameter based on the value of an environment\n\
variable.  For example,::\n\
\n\
\    ZBTest> print HOME\n\
\    The parameter "HOME" is not defined\n\
\    ZBTest> getenv HOME\n\
\    ZBTest> print HOME\n\
\    /u/mrohan\n\
\n\
The options available are\n\
\n\
-l\n\
\   Define an internal list parameter by splitting on the pathsep\n\
\n\
-s\n\
\   Define a simple scalar (string) parameter (default)\n\
\n\
-a\n\
\   Append the values (implies the -l option)\n\
\n\
-p\n\
\   Prepend the values (implies the -l option)\n\
\n\
If the target is not given then import to name.

Help_Usage=Usage: help [ -c | -f ] [ item ]
Help_Summary={0:>3}) "help", print help information on commands and functions
Help_Docstring=help: print help information on commands and functions\n\
\n\
\    Usage: help [ -c | -f ] [ item ]\n\
\n\
Print help information on commands and functions.  The options "-c" and\n\
"-f" select either command or function information.  Without an item\n\
argument, a summary of available commands ("-c") or functions ("-f") is\n\
printed.\n\
\n\
Examples:\n\
\n\
#. Print help information on the "help" command::\n\
\n\
\    ZBTest> help\n\
\n\
#. Print help information on the "help" command, equivalent to "help"::\n\
\n\
\    ZBTest> help -c help\n\
\n\
#. Print a summary of available commands::\n\
\n\
\    ZBTest> help -c\n\
\n\
#. Print help information on the "execute" command::\n\
\n\
\    ZBTest> help execute\n\
\n\
#. Print a summary of available functions::\n\
\n\
\    ZBTest> help -f\n\
#. Print help information on the "dirname" function::\n\
\n\
\    ZBTest> help -f dirname

Incr_Usage=Usage: incr [ -a ] name
Incr_Summary={0:>3}) "incr", increment a parameter value
Incr_Docstring=incr: increment a parameter value\n\
\n\
\    Usage: incr [ -a ] name\n\
\n\
Increment an integer parameter value.  The parameter must already\n\
exist and it's value is incremented by one.  This operation breaks the\n\
scoping models as the value is updated in the first scope the defines\n\
the parameter.  If this is deeper than the current scope, the incremented\n\
value is retained after the current scope ends.  If the -a option is given\n\
all instances of the parameter in all scopes is incremented (this is the\n\
mechanism used to increment the number of OK and failure tests).\n\
\n\
Examples::\n\
\n\
\    ZBTest> set -i num 0\n\
\    ZBTest> incr num\n\
\    Incremented the parmeter "num" to 1\n\
\    ZBTest> begin\n\
\    ZBTest> incr num\n\
\    Incremented the parmeter "num" to 2\n\
\    ZBTest> print num\n\
\    2\n\
\    ZBTest> end\n\
\    ZBTest> print num\n\
\    2

Mkdir_Usage=Usage: mkdir name
Mkdir_Summary={0:>3}) "mkdir", create a directory
Mkdir_Docstring=mkdir: create a directory\n\
\n\
\    Usage: mkdir name\n\
\n\
Create a new directory in the test area.  Directories created in the test\n\
area are automatically removed when the current scope exited (either at the\n\
end of the test script or via an explicit "end").

Noop_Usage=Usage: noop
Noop_Summary={0:>3}) "noop", the no operation command
Noop_Docstring=noop: the no operation command\n\
\n\
\    Usage: noop\n\
\n\
No operation.  The noop command does nothing and can be used in test\n\
scripts that would otherwise be empty, e.g., running a script based\n\
on the current platform::\n\
\n\
\    run $_platform\n\
\n\
If, on Unix, no additional tests are needed, the file ``unix/unix.zbt``\n\
can simply include the "noop" command (an empty file also works, however).

Prepend_Usage=Usage: prepend parameter value
Prepend_Summary={0:>3}) "prepend", prepend a value to list parameter
Prepend_Docstring=prepend: prepend a value to list parameter\n\
\n\
\    Usage: prepend parameter value\n\
\n\
The prepend command adds a value to the beginning of a list parameter.\n\
If the parameter doesn''t exist in the current scope, it is created as a\n\
list parameter.  The prepend append is normally used to force a path to\n\
the "front" of a search path parameter, e.g., the "path" or "searchpath"\n\
parameters.\n\
\n\
Example of use, where the "begin" command is used start a new, empty,\n\
scope::\n\
\n\
\    ZBTest> begin\n\
\    ZBTest> print -l l\n\
\    Emtpy list\n\
\    ZBTest> prepend l a\n\
\    ZBTest> print -l l\n\
\    1) "a"\n\
\    ZBTest> prepend l b\n\
\    ZBTest> print -l l\n\
\    1) "b"\n\
\    2) "a"

Print_Usage=Usage: print [ -l | -s ] parameter [ -l | -s ] parameter ...
Print_Summary={0:>3}) "print", print the value of parameters
Print_Docstring=print: print the value of parameters\n\
\n\
\    Usage: print [ -l | -s ] parameter [ -l | -s ] parameter ...\n\
\n\
Print the value of a scalar (-s, default) or list (-l) parameters.  With\n\
the -s option, the value is first converted to a string which gives the\n\
normal representation of value (list values are enclosed in square\n\
brackers, e.g.,d::\n\
\n\
\    ZBTest> print path\n\
\    [/home/mrohan/xmpl/test-area, /home/mrohan/bin, /usr/bin, /bin]\n\
\    ZBTest> print _platform\n\
\    unix\n\
\n\
With the -l option, the value is printed as a list.  If the parameter is\n\
not a list, it''s value is first converted to a list.  E.g.,::\n\
\n\
\    ZBTest> print -l l1\n\
\    ZBTest> print _platform\n\
\    unix\n\
\    ZBTest> print -l _platform\n\
\    1) "unix"\n\
\    ZBTest> print -l path\n\
\    1) "/home/mrohan/xmpl/test-area"\n\
\    2) "/home/mrohan/bin"\n\
\    3) "/usr/bin"\n\
\    4) "/bin"

Rename_Usage=Usage: rename old-name new-name
Rename_Summary={0:>3}) "rename", rename a file in the test area
Rename_Docstring=rename: rename a file in the test area\n\
\n\
\    Usage: rename old-name new-name\n\
\n\
Rename a file in the test area.  This is frequently used to rename\n\
files generated by applications to standard log file names.\n\
\n\
Example::\n\
\n\
\    ZBTest> rename generate.dat myapp-01.log\n\
\n\
Using the "nextlog" function would be more robust here, e.g.,::\n\
\n\
\    ZBTest> rename generate.dat $(nextlog)

Run_Usage=Usage: run script
Run_Summary={0:>3}) "run", run another ZBTest script
Run_Docstring=run: run another ZBTest script\n\
\n\
\    Usage: run script\n\
\n\
Run a script given the script name, i.e., without the "zbt" extension.\n\
The script should either be in the current directory or in a sub-directory\n\
with the same name as the script, e.g., "run xmpl", will try the files::\n\
\n\
\    xmpl.zbt\n\
\    xmpl/xmpl.zbt\n\
\n\
Once located, the ZBTest commands in the script are executed within the\n\
context of a new implicit scope.  Modifications to the environment made\n\
by the script are discarded (via undo actions) when the script completes.

Set_Usage=Usage: set [ -s | -i | -b | -f | -t | -u ] parameter value
Set_Summary={0:>3}) "set", set the value of a parameter
Set_Docstring=set: set the value of a parameter\n\
\n\
\    Usage: set [ -s | -i | -b | -f | -t | -u ] parameter value\n\
\n\
Set the value of a parameter.  The options selects type: integer,\n\
boolean, etc. or, for "-u" conditionally set the parameter only if it is\n\
not already defined, i.e., provide fall-back values for parameters that\n\
can be set on the command line.\n\
\n\
Examples,\n\
\n\
* Set a parameter to a string value, the "-s" is optional::\n\
\n\
\    ZBTest> set SFO "San Francisco"\n\
\    ZBTest> print SFO\n\
\    San Francisco\n\
\    ZBTest> set -s LLW Lilongwe\n\
\    ZBTest> print LLW\n\
\    Lilongwe\n\
\n\
* Set a parameter to an integer value, the "-i" is required::\n\
\n\
\    ZBTest> set -i ten 10\n\
\    ZBTest> print ten\n\
\    10\n\
\n\
* Set a parameter to a Boolean value, the "-b" is required::\n\
\n\
\    ZBTest> set -b flag true\n\
\    ZBTest> print flag\n\
\    TRUE\n\
\n\
* Set a parameter to a floating point value, the "-f" is required::\n\
\n\
\    ZBTest> set -f pi 3.141592\n\
\    ZBTest> print pi\n\
\    3.14159E+00\n\
\n\
* Set a parameter to a time value, the "-t" is required.  The only time\n\
\  value supported is the special time "now"::\n\
\n\
\    ZBTest> set -t start now\n\
\    ZBTest> print start\n\
\    1:59 PM 11/21/16\n\
\n\
* Set a parameter if not already defined, e.g., via the command line::\n\
\n\
\    ZBTest> set -u -s build_opt ""

Setenv_Usage=Usage: setenv [ -l | -p ] variable value
Setenv_Summary={0:>3}) "setenv", set an environment variable
Setenv_Docstring=setenv: set an environment variable\n\
\n\
\    Usage: setenv [ -l | -p ] variable value\n\
\n\
Set an environment variable to a value, e.g.,::\n\
\n\
\    ZBTest> setenv PROFILE yes\n\
\    Setting the environment variable "PROFILE" to "yes"\n\
\n\
sets the variable "PROFILE" to the value "yes" for the current process and\n\
any processes created using the "execute" command.  The definition is\n\
scoped and is reverted when the current scope exits (normally at the end of\n\
a test script).  The reversion is either by deleting the environment\n\
variable it did not have a current value or by restoring the value prior\n\
to the setenv.\n\
\n\
The options allow the definition of environment variables based on the\n\
value of parameters.  For simple definitions, the "-p" option can be used,\n\
e.g.,::\n\
\n\
\    ZBTest> set LLW Lilongwe\n\
\    ZBTest> setenv -p DESTINATION LLW\n\
\    Setting the environment variable "DESTINATION" to "Lilongwe"\n\
\n\
parameters are converted to strings for these simple definitions.  If the\n\
parameter is a list, the "-l" option can be used which concatenates the\n\
list elements into string separated by the OS separator character.   This\n\
can be used to set PATH values, etc., e.g.,::\n\
\n\
\    ZBTest> set mypath /bin\n\
\    ZBTest> append mypath /usr/bin\n\
\    ZBTest> setenv -l PATH mypath\n\
\    Setting the environment variable "PATH" to "/bin:/usr/bin"

Which_Usage=Usage: which [ -e | -f ] name
Which_Summary={0:>3}) "which", print the location of a file or command
Which_Docstring=which: print the location of a file or command\n\
\n\
\    Usage: which [ -e | -f ] name\n\
\n\
Print the locations of files.  The zbtest locates various files during the\n\
execution of a test script, e.g., the "copy" command will copy a data file\n\
located via a search of the directories on the "searchpath" parameter, the\n\
"execute" command uses the "path" parameter.  As an aid to debugging, the\n\
"which" command print the results of these searches.  The options select\n\
the type of file to search for:\n\
\n\
* "-e" Search for a file that is executables\n\
* "-f" Search for a file\n\
\n\
The result is printed.\n\
\n\
Example:\n\
\n\
* Executeable::\n\
\n\
\    ZBTest> which -e ls\n\
\    /bin/ls
